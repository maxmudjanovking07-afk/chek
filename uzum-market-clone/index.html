<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzum Market - Kamera orqali qidiruv</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">Uzum<span class="logo-highlight">Market</span></div>
            <button id="cameraBtn" class="btn btn-camera">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                <span>Rasmga olish</span>
            </button>
            <div class="search-bar">
                <input type="text" placeholder="Tovarlarni qidirish...">
                <button class="search-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
            <div class="nav-actions">
                <div class="action-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span>Kirish</span>
                </div>
                <div class="action-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    <span>Savatcha</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <!-- Banner -->
        <section class="banner-section">
            <div class="banner">
                <div class="banner-text">
                    <h2>Katta Chegirmalar</h2>
                    <p>Yangi yil oldidan barcha tovarlarga 50% gacha chegirmalar!</p>
                </div>
            </div>
        </section>

        <!-- Product Grid -->
        <section class="products-section">
            <h2 class="section-title">Ommabop tovarlar</h2>
            <div id="productGrid" class="product-grid">
                <!-- Products will be dynamically added here -->
            </div>
        </section>
    </main>

    <!-- Camera Modal -->
    <div id="cameraModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Kamera bilan qidirish</h3>
                <button id="closeCameraBtn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <video id="videoElement" autoplay playsinline></video>
                <div class="scanner-overlay"></div>
                <p class="camera-hint">Tovarni rasmga oling</p>
                <div id="captureLoading" class="hidden">
                    <div class="spinner"></div>
                    <p>Tovar qidirilmoqda...</p>
                </div>
            </div>
            <div class="modal-footer">
                <button id="captureBtn" class="btn btn-primary btn-large">Rasmga olish</button>
            </div>
        </div>
    </div>

    <!-- Found Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Qidiruv natijasi</h3>
                <button id="closeProductModalBtn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div id="foundProductDetails" class="found-product">
                    <!-- Found product details will be injected here -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="addToCartBtn" class="btn btn-primary btn-large">Savatchaga qo'shish</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
